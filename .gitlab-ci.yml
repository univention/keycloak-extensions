---
stages:
  - infrastructure
  - release
  - documentation

# Handles setup and updates of the environment `production`.
setup_environment_production:
  stage: infrastructure
  trigger:
    include: "/.gitlab/ci/environment/environment_pipeline.yml"
include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.66.0"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "jobs/lint-commit-messages.yaml"
      - "jobs/lint-pre-commit.yaml"
      - "jobs/semantic-release-env.yaml"
      - "jobs/container-build-external-buildkit.yaml"
      - "jobs/package-and-publish-helm-charts-external.yaml"
      - "jobs/check-debian-updates.yaml"
      - "templates/sonarqube.yaml"
  - project: "univention/infrastructure/docker-services"
    ref: "master"
    file:
      - "dind.yml"

variables:
  SOUVAP_HELM_PROJECT_ID: 77

lint-pre-commit:
  before_script:
    - "helm repo add bitnami https://charts.bitnami.com/bitnami"

package-helm-charts:
  before_script:
    - helm repo add bitnami https://charts.bitnami.com/bitnami

.build-matrix: &build-matrix
  - IMAGE_NAME: "keycloak-handler"
    BUILD_CONTEXT: "$CI_PROJECT_DIR/handler"
  - IMAGE_NAME: "keycloak-proxy"
    BUILD_CONTEXT: "$CI_PROJECT_DIR/proxy"
  - IMAGE_NAME: "e2e-tests"
    BUILD_CONTEXT: "$CI_PROJECT_DIR/tests/e2e"
    DOCKERFILE_PATH: "$CI_PROJECT_DIR/tests/e2e/Dockerfile"

.publish-matrix: &publish-matrix
  - IMAGE_NAME:
      - "keycloak-handler"
      - "keycloak-proxy"

container-build:
  parallel:
    matrix: *build-matrix
  variables:
    TARGET_ENVIRONMENT: "production"
    DOCKERFILE_PATH: "${CI_PROJECT_DIR}/docker/${IMAGE_NAME}/Dockerfile"

container-malware-scan:
  parallel:
    matrix: *publish-matrix

container-sign-external:
  parallel:
    matrix: *publish-matrix

push-image-external:
  parallel:
    matrix: *publish-matrix

container-release-attestation:
  parallel:
    matrix: *build-matrix

lint-helm-chart:
  stage: "lint"
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'

# Handles setup and updates of the environment `staging`.
setup_environment_staging:
  stage: infrastructure
  trigger:
    include: "/.gitlab/ci/environment/environment_pipeline.yml"
  variables:
    TARGET_ENVIRONMENT: "staging"
  rules:
    - if: $CI_COMMIT_BRANCH == 'development'

# Handles setup and updates of the environment for an MR commit, based on the merge request numerical ID.
setup_environment_mr:
  stage: infrastructure
  trigger:
    include: "/.gitlab/ci/environment/environment_pipeline.yml"
  variables:
    TARGET_ENVIRONMENT: "mr-${CI_MERGE_REQUEST_IID}"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# A GitLab Release is done upon semantic version tag push.
release_pipeline:
  stage: release
  trigger:
    include: "/.gitlab/ci/release/release_pipeline.yml"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

# The Docker images for `proxy` and `handler` are published upon semantic version tag push as well.
docker_pipeline:
  stage: release
  trigger:
    include: "/.gitlab/ci/docker/docker_pipeline.yml"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

# Generates documentation artifacts for the current commit.
# This pipeline is based on the documentation and coockiecutter project generator at:
# https://git.knut.univention.de/univention/documentation/docs-template/-/tree/main/
documentation_pipeline:
  stage: documentation
  trigger:
    include: "/.gitlab/ci/documentation/documentation_pipeline.yml"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

