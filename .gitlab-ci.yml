---
include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.67.1"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "jobs/lint-commit-messages.yaml"
      - "jobs/lint-pre-commit.yaml"
      - "jobs/semantic-release-env.yaml"
      - "jobs/container-build-external-buildkit.yaml"
      - "jobs/package-and-publish-helm-charts-external.yaml"
      - "jobs/check-debian-updates.yaml"
      - "templates/sonarqube.yaml"
  - project: "univention/infrastructure/docker-services"
    ref: "master"
    file:
      - "dind.yml"

variables:
  SOUVAP_HELM_PROJECT_ID: 77

lint-pre-commit:
  before_script:
    - "helm repo add bitnami https://charts.bitnami.com/bitnami"

package-helm-charts:
  before_script:
    - helm repo add bitnami https://charts.bitnami.com/bitnami

.build-matrix: &build-matrix
  - IMAGE_NAME: "keycloak-handler"
    BUILD_CONTEXT: "$CI_PROJECT_DIR/handler"
  - IMAGE_NAME: "keycloak-proxy"
    BUILD_CONTEXT: "$CI_PROJECT_DIR/proxy"
  - IMAGE_NAME: "e2e-tests"
    BUILD_CONTEXT: "$CI_PROJECT_DIR/tests/e2e"
    DOCKERFILE_PATH: "$CI_PROJECT_DIR/tests/e2e/Dockerfile"

.publish-matrix: &publish-matrix
  - IMAGE_NAME:
      - "keycloak-handler"
      - "keycloak-proxy"

container-build:
  parallel:
    matrix: *build-matrix
  variables:
    DOCKERFILE_PATH: "${CI_PROJECT_DIR}/docker/${IMAGE_NAME}/Dockerfile"

container-malware-scan:
  parallel:
    matrix: *publish-matrix

container-sign-external:
  parallel:
    matrix: *publish-matrix

push-image-external:
  parallel:
    matrix: *publish-matrix

container-release-attestation:
  parallel:
    matrix: *build-matrix

lint-helm-chart:
  stage: "lint"
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: "never"
    - when: "on_success"
  image:
    name: "registry.opencode.de/bmi/opendesk/components/platform-development/images/helm:1.0.2"
    entrypoint: [""]
  script:
    - helm repo add bitnami https://charts.bitnami.com/bitnami
    - helm dependency build helm/keycloak-extensions
    - helm lint helm/keycloak-extensions --strict

unit-tests:
  image: gitregistry.knut.univention.de/univention/dev/projects/keycloak/keycloak-extensions/keycloak-handler:${RELEASE_VERSION}
  stage: "test"
  script:
    - pip install -r tests/requirements.txt
    - pytest -vv tests/handler

tests:
  extends: .dind
  stage: "test"
  image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:24.0.7"
  variables:
    IMAGE_TAG: ${RELEASE_VERSION}
  artifacts:
    when: on_failure
    paths:
      - tests/e2e/test-results/**/*.webm
    expire_in: 1 day
  script:
    - docker compose --profile=test up -d --wait keycloak database
    - docker compose --profile=test up -d --wait proxy handler
    - docker compose --profile=test run --name e2e-ci e2e-tests
  after_script:
    - docker cp e2e-ci:/e2e/test-results/ $CI_PROJECT_DIR/tests/e2e/ || true
    - docker compose --profile=test down

chart-tests:
  image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.0"
  stage: "test"
  script:
    - helm dep build helm/keycloak-extensions
    - pytest -vv helm-unittests


check-debian-updates:
  parallel:
    matrix: *publish-matrix
  variables:
    TARGET_IMAGE: "${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:latest"

sonarqube:
  extends: .sonarqube
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'development'


...
