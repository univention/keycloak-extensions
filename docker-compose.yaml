version: "3.7"
services:
  # Environment of the pre-commit linter.

  keycloak:
    # Test Keycloak instance already configured according to README.md
    container_name: keycloak
    image: keycloak
    build: ./keycloak/test
    command: start-dev --http-enabled=true --import-realm
    ports:
      - 5050:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=univention
      - PROXY_ADDRESS_FORWARDING=true
      - KC_PROXY=edge
      - KC_HOSTNAME=proxy
      - KC_HOSTNAME_PORT=8181
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KEYCLOAK_LOGLEVEL=ALL
      - ROOT_LOGLEVEL=ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/master"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  proxy:
    # The proxy in front of Keycloak handling blocks and captcha.
    # More at /proxy/README.md
    container_name: keycloak-proxy
    image: keycloak-proxy:develop
    build:
      context: ./proxy
      dockerfile: ../docker/keycloak-proxy/Dockerfile
    restart: unless-stopped
    ports:
      - 8181:8181
    depends_on:
      keycloak:
        condition: service_healthy
      database:
        condition: service_healthy
      handler:
        condition: service_started
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      LOG_LEVEL: debug
      # Database
      POSTGRES_USER: postgres
      POSTGRES_HOST: database
      POSTGRES_DATABASE_NAME: handler
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
      # Captcha
      CAPTCHA_SITE_KEY: 6LcUyZkiAAAAAHo98CowhZFoc-E-3yeo38Hs1HSB
      CAPTCHA_SECRET_KEY: 6LcUyZkiAAAAAOM0G7kctpprpOtM6DWKagf8Ew88

  handler:
    # The container checking for new events and triggering actions for the proxy.
    # More at /handler/README.md
    container_name: keycloak-handler
    image: keycloak-handler:develop
    build:
      context: ./handler
      dockerfile: ../docker/keycloak-handler/Dockerfile
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      # Keycloak
      KC_AUTH_URL: http://keycloak:8080/admin
      KC_USER: admin
      KC_PASS: univention
      KC_REALM: master
      # Database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE_NAME: handler
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      # Logging
      LOG_LEVEL: DEBUG
      # Configuration
      FAILED_ATTEMPTS_FOR_IP_BLOCK: 7
      FAILED_ATTEMPTS_FOR_DEVICE_BLOCK: 5
      FAILED_ATTEMPTS_FOR_CAPTCHA_TRIGGER: 3
      EVENTS_RETENTION_PERIOD: 1
      AUTO_EXPIRE_RULE_IN_MINS: 1
      DEVICE_PROTECTION_ENABLE: "True"
      IP_PROTECTION_ENABLE: "True"
      CAPTCHA_PROTECTION_ENABLE: "False"
      # Email
      SMTP_HOST: mail.example.org
      SMTP_PORT: 587
      MAIL_FROM: univention@example.org
      SMTP_USERNAME: user
      SMTP_PASSWORD: somepassword
      NEW_DEVICE_LOGIN_SUBJECT: "New device login"

  database:
    # PostgreSQL database shared between proxy and handler containers.
    container_name: keycloak-extensions-postgres
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: handler
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-dev:
    # A non configured instance of Keycloak for development.
    container_name: keycloak-dev
    image: keycloak
    profiles: [ "development" ]
    build:
      context: ./keycloak
      args:
        KEYCLOAK_VERSION: 19.0.3
    command: start-dev --http-enabled=true --import-realm
    ports:
      - 8080:8080
      - 8787:8787
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=univention
      - PROXY_ADDRESS_FORWARDING=true
      - KC_PROXY=edge
      - KEYCLOAK_LOGLEVEL=ALL
      - ROOT_LOGLEVEL=ALL
      - DEBUG=true
      - DEBUG_PORT='*:8787'
      - DEBUG_SUSPEND=y # to wait until a debugger is connected

  e2e-tests:
    # Test suite to run end-to-end tests
    container_name: e2e-tests
    image: ${CI_REGISTRY_IMAGE:-keycloak-extensions}/e2e-tests:${IMAGE_TAG:-develop}
    profiles: [ "test" ]
    init: true # https://playwright.dev/docs/ci#docker
    build: ./tests/e2e
    depends_on:
      keycloak:
        condition: service_healthy
      database:
        condition: service_started
      handler:
        condition: service_started
      proxy:
        condition: service_started
    command: pytest --base-url http://proxy:8181 --slowmo 500 --video retain-on-failure

  # Environment which allows to run the tool "helm-docs". See the directory
  # "/helm" for more details.
  helm-docs:
    profiles:
      - test
    image: "jnorwood/helm-docs:v1.11.0"
    command: "-c helm"
    volumes:
      - ./helm:/helm-docs/helm

  test-helm:
    image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.0"
    pull_policy: "if_not_present"
    command: "pytest tests/"
    profiles:
      - "test"
    volumes:
      - "./helm/:/app/helm/"
      - "./helm-unittests/:/app/tests"

  pre-commit:
    profiles:
      - "pre-commit"
    image: gitregistry.knut.univention.de/univention/dev/tooling/pre-commit/upx-pre-commit:${IMAGE_TAG:-latest}
    volumes:
      - type: bind
        source: .
        target: /code
      - type: volume
        # pre-commit installs dependencies, having them cached speeds things up
        # a lot.
        source: pre-commit-cache
        target: /cache

volumes:
  pre-commit-cache:


...
