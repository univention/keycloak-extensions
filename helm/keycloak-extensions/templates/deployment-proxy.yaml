---

apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ printf "%s-proxy" (include "common.names.fullname" .) }}
  labels:
      {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
    {{- include "nubus-common.annotations.render" ( dict
    "values" ( list .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
spec:
  replicas: {{ .Values.proxy.replicaCount }}
  selector:
    matchLabels:
      {{- $commonLabels := include "common.labels.matchLabels" . | fromYaml }}
      {{- $uiLabels := dict "app.kubernetes.io/name" (printf "%s-proxy" (include "common.names.fullname" .)) }}
      {{- merge $uiLabels $commonLabels | toYaml | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-proxy.yaml") . | sha256sum }}
        {{- with .Values.proxy.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- $commonLabels := include "common.labels.standard" . | fromYaml }}
        {{- $uiLabels := dict "app.kubernetes.io/name" (printf "%s-proxy" (include "common.names.fullname" .)) }}
        {{- $mergedLabels := merge $uiLabels $commonLabels }}
        {{- toYaml $mergedLabels | nindent 8 }}
    spec:
      {{- with .Values.proxy.affinity }}
      affinity:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- with .Values.proxy.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- with .Values.proxy.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- with .Values.proxy.podSecurityContext }}
      securityContext:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- if or .Values.proxy.imagePullSecrets .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- if .Values.proxy.imagePullSecrets }}
        {{- range .Values.proxy.imagePullSecrets }}
        - name: "{{ . }}"
        {{- end }}
        {{- else if .Values.global.imagePullSecrets }}
        {{- range .Values.global.imagePullSecrets }}
        - name: "{{ . }}"
        {{- end }}
        {{- end }}
      {{- end }}
      {{- if .Values.handler.serviceAccount.create }}
      serviceAccountName: {{ printf "%s-proxy" (include "common.names.fullname" .) }}
      {{- end }}
      {{- if .Values.handler.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.handler.terminationGracePeriodSeconds }}
      {{- end }}
      containers:
        - name: "keycloak-bfp-proxy"
          securityContext:
            {{- toYaml .Values.proxy.securityContext | nindent 12 }}
          image: "{{ .Values.global.imageRegistry | default .Values.proxy.image.registry }}/{{ .Values.proxy.image.repository }}{{ if .Values.proxy.image.sha256 }}@sha256:{{ .Values.proxy.image.sha256 }}{{ else }}:{{ .Values.proxy.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.proxy.image.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-proxy" (include "common.names.fullname" .) }}
          env:
            - name: KC_USER
              value: {{ tpl .Values.keycloak.auth.username . }}
            - name: KC_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.keycloak.auth.existingSecret.name . }}
                  key: {{ include "common.secrets.key" (dict "existingSecret" .Values.keycloak.auth.existingSecret "key" "adminPassword") }}
            - name: POSTGRES_USER
              value: {{ tpl .Values.postgresql.auth.username . }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.postgresql.auth.existingSecret.name . }}
                  key: {{ include "common.secrets.key" (dict "existingSecret" .Values.postgresql.auth.existingSecret "key" "password") }}
            {{- if .Values.proxy.appConfig.captcha.existingSecret.name }}
            - name: CAPTCHA_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.proxy.appConfig.captcha.existingSecret.name . }}
                  key: {{ include "common.secrets.key" (dict "existingSecret" .Values.proxy.appConfig.captcha.existingSecret "key" "site_key") }}
            - name: CAPTCHA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.proxy.appConfig.captcha.existingSecret.name . }}
                  key: {{ include "common.secrets.key" (dict "existingSecret" .Values.proxy.appConfig.captcha.existingSecret "key" "secret_key") }}
            {{- end }}
            {{- if .Values.postgresql.connection.customca }}
            - name: NODE_EXTRA_CA_CERTS
              value: "{{ .Values.postgresql.connection.pathCA }}"
            {{- end }}
          ports:
            {{- range $key, $value := .Values.proxy.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $value.containerPort }}
              protocol: {{ $value.protocol }}
            {{- end }}
          volumeMounts:
            {{- if .Values.postgresql.connection.customca }}
            - name: "customca"
              mountPath: "{{ .Values.postgresql.connection.pathCA }}"
              subPath: rootca.pem
              readOnly: true
            {{- end  }}
          {{- if .Values.proxy.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.proxy.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.proxy.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.proxy.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.proxy.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.proxy.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.proxy.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.proxy.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.proxy.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.proxy.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.proxy.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.proxy.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.proxy.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.proxy.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.proxy.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.proxy.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.proxy.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.proxy.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.proxy.startupProbe.enabled }}
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.proxy.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.proxy.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.proxy.startupProbe.timeoutSeconds }}
            successThreshold: {{ .Values.proxy.startupProbe.successThreshold }}
            failureThreshold: {{ .Values.proxy.startupProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          {{- if .Values.proxy.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.proxy.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.postgresql.connection.customca }}
        - name: "customca"
          configMap:
            name: {{ printf "%s-proxy-ssl" (include "common.names.fullname" .) }}
        {{- end }}
...
