---

apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ printf "%s-handler" (include "common.names.fullname" .) }}
  labels:
      {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
    {{- include "nubus-common.annotations.render" ( dict
    "values" ( list .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
spec:
  replicas: {{ .Values.handler.replicaCount }}
  selector:
    matchLabels:
      {{- $commonLabels := include "common.labels.matchLabels" . | fromYaml }}
      {{- $uiLabels := dict "app.kubernetes.io/name" (printf "%s-handler" (include "common.names.fullname" .)) }}
      {{- merge $uiLabels $commonLabels | toYaml | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-handler.yaml") . | sha256sum }}
        {{- with .Values.handler.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- $commonLabels := include "common.labels.standard" . | fromYaml }}
        {{- $uiLabels := dict "app.kubernetes.io/name" (printf "%s-handler" (include "common.names.fullname" .)) }}
        {{- $mergedLabels := merge $uiLabels $commonLabels }}
        {{- toYaml $mergedLabels | nindent 8 }}
    spec:
      {{- with .Values.handler.affinity }}
      affinity:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- with .Values.handler.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- with .Values.handler.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- with .Values.handler.podSecurityContext }}
      securityContext:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- if or .Values.imagePullSecrets .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: "{{ . }}"
        {{- end }}
        {{- range .Values.imagePullSecrets }}
        - name: "{{ . }}"
        {{- end }}
      {{- end }}
      {{- if .Values.handler.serviceAccount.create }}
      serviceAccountName: {{ printf "%s-handler" (include "common.names.fullname" .) }}
      {{- end }}
      {{- if .Values.handler.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.handler.terminationGracePeriodSeconds }}
      {{- end }}
      containers:
        - name: "main"
          securityContext:
            {{- toYaml .Values.handler.securityContext | nindent 12 }}
          image: "{{ .Values.handler.image.registry | default .Values.global.imageRegistry }}/{{ .Values.handler.image.repository }}{{ if .Values.handler.image.sha256 }}@sha256:{{ .Values.handler.image.sha256 }}{{ else }}:{{ .Values.handler.image.tag }}{{ end }}"
          imagePullPolicy: {{ coalesce .Values.handler.image.pullPolicy .Values.global.imagePullPolicy | quote }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-handler" (include "common.names.fullname" .) }}
          env:
            - name: KC_USER
              value: {{ tpl (required "keycloak.auth.username is required" .Values.keycloak.auth.username) . }}
            - name: KC_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.keycloak.auth.existingSecret "defaultNameSuffix" "keycloak-credentials" "context" .)}}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.keycloak.auth.existingSecret "key" "adminPassword" "context" .)}}
            - name: POSTGRES_USER
              value: {{ tpl (required "postgresql.auth.username is required" .Values.postgresql.auth.username) . }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.postgresql.auth.existingSecret "defaultNameSuffix" "postgresql-credentials" "context" .)}}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.postgresql.auth.existingSecret "key" "password" "context" .)}}
            - name: SMTP_AUTH_ENABLED
              value: {{ .Values.smtp.auth.enabled | quote }}
            {{- if .Values.smtp.auth.enabled }}
            - name: SMTP_USERNAME
              value: {{ tpl (required "smtp.auth.username is required" .Values.smtp.auth.username) . }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.smtp.auth.existingSecret "defaultNameSuffix" "smtp-credentials" "context" .)}}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.smtp.auth.existingSecret "key" "password" "context" .)}}
            {{- end }}
          {{- if .Values.handler.service.ports }}
          ports:
            {{- range $key, $value := .Values.handler.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $value.containerPort }}
              protocol: {{ $value.protocol }}
            {{- end }}
          {{- end }}
          {{- if .Values.handler.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.handler.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.handler.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  {{- .Values.handler.livenessProbe.command | nindent 18 }}
            initialDelaySeconds: {{ .Values.handler.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.handler.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.handler.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.handler.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.handler.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.handler.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.handler.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.handler.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  {{- .Values.handler.readinessProbe.command | nindent 18 }}
            initialDelaySeconds: {{ .Values.handler.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.handler.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.handler.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.handler.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.handler.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.handler.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.handler.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.handler.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  {{- .Values.handler.startupProbe.command | nindent 18 }}
            initialDelaySeconds: {{ .Values.handler.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.handler.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.handler.startupProbe.timeoutSeconds }}
            successThreshold: {{ .Values.handler.startupProbe.successThreshold }}
            failureThreshold: {{ .Values.handler.startupProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.handler.resources | nindent 12 }}
          {{- if .Values.handler.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.handler.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
