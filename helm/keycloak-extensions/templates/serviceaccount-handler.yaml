{{- if .Values.handler.serviceAccount.create }}
---
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: {{ printf "%s-handler" (include "common.names.fullname" .) }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
{{- include "nubus-common.annotations.render" ( dict
  "values" ( list  .Values.additionalAnnotations .Values.handler.serviceAccount.annotations )
  "context" . )
  | nindent 2 }}
automountServiceAccountToken: {{ .Values.handler.serviceAccount.automountServiceAccountToken }}
...
{{- end }}
