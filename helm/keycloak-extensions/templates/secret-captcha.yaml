{{ if .Values.handler.appConfig.captchaProtectionEnable}}
{{- $_ := required "A captcha site_key password is required, see parameter captcha." (coalesce .Values.proxy.appConfig.captcha.captchaSiteKey (.Values.proxy.appConfig.captcha.existingSecret).name) }}
{{- $_ := required "A captcha secret_key password is required, see parameter captcha." (coalesce .Values.proxy.appConfig.captcha.captchaSecretKey (.Values.proxy.appConfig.captcha.existingSecret).name) }}
{{- if (not (.Values.proxy.appConfig.captcha.existingSecret).name) }}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ include "nubus-common.secrets.name" (dict "defaultNameSuffix" "captcha-credentials" "context" .) | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- if .Values.additionalAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" ( dict "value" .Values.additionalAnnotations "context" . ) | nindent 4 }}
  {{- end }}
stringData:
  site_key: {{ .Values.proxy.appConfig.captcha.captchaSiteKey | quote }}
  secret_key: {{ .Values.proxy.appConfig.captcha.captchaSecretKey | quote }}
{{- end }}
{{- end }}
