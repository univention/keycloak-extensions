---
global:
  certManagerIssuer: "linting-issuer"

postgresql:
  connection:
    host: "linting-host"
    port: "linting-port"
  auth:
    username: "linting-username"
    database: "linting-database"
    existingSecret:
      name: "custom-postgres-credentials"
      keyMapping:
        password: "custom-password"

keycloak:
  auth:
    username: "linting-adminUsername"
    realm: "linting-realm"
    existingSecret:
      name: "custom-keycloak-credentials"
      keyMapping:
        adminPassword: "admin_password"
  connection:
    host: "linting-host"

proxy:
  ingress:
    ingressClassName: "linting-ingress"
    tls:
      secretName: "linting-secret"

handler:
  service:
    enabled: true
    type: "ClusterIP"
    # -- Additional custom annotations to add to service.
    additionalAnnotations: {}
    ports:
      http:
        containerPort: 8181
        port: 8181
        protocol: "TCP"

    sessionAffinity:
      enabled: false
      timeoutSeconds: 10800

smtp:
  auth:
    username: "stub-values-username"
    password: "stub-value"
